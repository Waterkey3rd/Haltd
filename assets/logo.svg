<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 400" width="1052" height="400" role="img" aria-label="haltd">
  <title>haltd</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2540"/>
      <stop offset="1" stop-color="#090E1A"/>
    </linearGradient>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AEBBD3"/>
    </linearGradient>
  </defs>

  <style>
    .wm     { fill: none; stroke: #0F172A; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
    .wm-acc { stroke: #06B6D4; }
    @media (prefers-color-scheme: dark) {
      .wm     { stroke: #F1F5F9; }
      .wm-acc { stroke: #22D3EE; }
    }
  </style>

  <!-- 图标（由 512 画布缩放到 300） -->
  <g transform="translate(40 40) scale(0.625)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M162 230 H198 V194 H230 V230 H262 V194 H294 V230 H350" stroke="#22D3EE"/>
      <path d="M162 290 H190 C206 290 206 262 224 262 S258 318 276 318 S304 290 326 290 H350" stroke="#FF7A2F"/>
    </g>
    <g fill="none" stroke="url(#pg)" stroke-width="48" stroke-linecap="round">
      <path d="M162 122 V390"/>
      <path d="M350 122 V390"/>
    </g>
  </g>

  <!-- 字标 "haltd"：全部为描边路径，不依赖任何字体 -->
  <g transform="translate(-20 0)">
    <!-- h -->
    <path class="wm" d="M450 115 V285 M450 232 A35 47 0 0 1 520 232 V285"/>
    <!-- a -->
    <circle class="wm" cx="632" cy="235" r="50"/>
    <path class="wm" d="M682 185 V285"/>
    <!-- l -->
    <path class="wm" d="M744 115 V285"/>
    <!-- t -->
    <path class="wm" d="M826 135 V258 A27 27 0 0 0 853 285 H860 M800 185 H862"/>
    <!-- d（青色强调：daemon） -->
    <circle class="wm wm-acc" cx="970" cy="235" r="50"/>
    <path class="wm wm-acc" d="M1020 115 V285"/>
  </g>
</svg>
