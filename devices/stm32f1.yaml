# STM32F10x debug configuration (RM0008 §31.16.3, DBGMCU_CR at 0xE0042004).
family: stm32f1

memory:
  - { name: FLASH, start: 0x08000000, size: 0x00010000, kind: flash }
  - { name: SRAM,  start: 0x20000000, size: 0x00005000, kind: ram }

flashSectorSize: 0x400

# DBG_SLEEP | DBG_STOP | DBG_STANDBY: keeps the debug port alive in WFI.
postConnect:
  - { name: DBGMCU_CR, addr: 0xE0042004, set: 0x00000007 }

freeze:
  iwdg: { addr: 0xE0042004, bit: 8 }
  wwdg: { addr: 0xE0042004, bit: 9 }
  tim1: { addr: 0xE0042004, bit: 10 }
  tim2: { addr: 0xE0042004, bit: 11 }
  tim3: { addr: 0xE0042004, bit: 12 }
  tim4: { addr: 0xE0042004, bit: 13 }
