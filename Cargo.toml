[workspace]
resolver = "2"
members = [
    "crates/probe-api",
    "crates/probe-jlink",
    "crates/probe-mock",
    "crates/symbols",
    "crates/engine",
    "crates/server",
    "crates/visualizer",
    "crates/tsdb",
    "crates/sampler",
    "crates/rtt",
    "crates/svd",
    "bins/haltd",
    "bins/jlbench",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
probe-api = { path = "crates/probe-api" }
probe-jlink = { path = "crates/probe-jlink" }
probe-mock = { path = "crates/probe-mock" }
symbols = { path = "crates/symbols" }
engine = { path = "crates/engine" }
server = { path = "crates/server" }
visualizer = { path = "crates/visualizer" }
tsdb = { path = "crates/tsdb" }
sampler = { path = "crates/sampler" }
rtt = { path = "crates/rtt" }
svd = { path = "crates/svd" }

anyhow = "1"
base64 = "0.22"
bincode = "1.3"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
clap = { version = "4", features = ["derive", "env"] }
roxmltree = "0.20"
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
libloading = "0.9"
memmap2 = "0.9"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["debug-embed"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = "0.61"

[profile.release]
debug = 1
lto = "thin"

# What gets handed to other people: slower to build, smallest and fastest result.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true

# The symbol index is CPU-bound, and an unoptimized build makes tests against
# real ELFs unusably slow.
[profile.dev.package."*"]
opt-level = 2
