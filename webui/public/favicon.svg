<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="haltd logo">
  <title>haltd</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2540"/>
      <stop offset="1" stop-color="#090E1A"/>
    </linearGradient>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AEBBD3"/>
    </linearGradient>
  </defs>

  <!-- 背景底板 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- 两路探针信号：停机期间仍在流动（画在柱子后面） -->
  <g fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- 探针 A：数字方波（青色） -->
    <path d="M162 230 H198 V194 H230 V230 H262 V194 H294 V230 H350" stroke="#22D3EE"/>
    <!-- 探针 B：模拟曲线（橙色） -->
    <path d="M162 290 H190 C206 290 206 262 224 262 S258 318 276 318 S304 290 326 290 H350" stroke="#FF7A2F"/>
  </g>

  <!-- H：两根竖柱 = 暂停键（halt） -->
  <g fill="none" stroke="url(#pg)" stroke-width="48" stroke-linecap="round">
    <path d="M162 122 V390"/>
    <path d="M350 122 V390"/>
  </g>
</svg>
